<!DOCTYPE html>

<html>
  <head>
    <title>Smart Calculator</title>
    <link rel="stylesheet" href="smartCalculator.css">
  </head>

  <body>
    <div class="outer-div">
      <div class="screen-div">
        <div class="show-result">
          <p class="p-calculator">Calculator</p>
          <p class="p-show-result js-show-result">0</p>
        </div>
      </div>

      <div class="buttons-div">
        <div><hr class="white-line"></div>  
        
        <div class="column-buttons">
          <button>7</button>
          <button>8</button>
          <button>9</button>
          <button>+</button>
        </div>
        <div class="column-buttons">
          <button>4</button>
          <button>5</button>
          <button>6</button>
          <button>-</button>
        </div>
        <div class="column-buttons">
          <button>1</button>
          <button>2</button>
          <button>3</button>
          <button>*</button>
        </div>
        <div class="column-buttons">
          <button class="clear-button">Clear</button>
          <button>0</button>
          <button>=</button>
          <button>/</button>
        </div>
      </div>
    </div>

    <script src="smartCalculator.js"></script>
  </body>
</html>
